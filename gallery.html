<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <div class="container-fluid">
      
      <div id="sidebar-placeholder"></div>

      <main class="main-content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2">Gallery</h1>
          <small class="blog-post-datetime"></small>
        </div>

        <div class="row" id="gallery-row"></div>

      </main>
    </div>
    
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-body">
            <img src="" class="img-fluid" id="modalImage" alt="">
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    
    <script>
      function insertGalleryCard(imageFilePath, imageTitle, imageCaption = '') {
        const galleryRow = document.getElementById('gallery-row'); 

        if (!galleryRow) {
          console.error("Error: The ID 'gallery-row' not found.");
          return;
        }

        const captionHtml = imageCaption 
          ? `<p class="card-text">${imageCaption}</p>` 
          : `<p class="card-text">...</p>`;

        const cardHtml = `
          <div class="col-md-6 mb-4">
            <div class="card fixed-ratio-card">
              <img src="${imageFilePath}" data-full-size="${imageFilePath}" 
                   class="card-img-top modal-trigger" data-bs-toggle="modal" 
                   data-bs-target="#imageModal" alt="${imageTitle}">
              <div class="card-body">
                <h5 class="card-title">${imageTitle}</h5>
                ${captionHtml}
              </div>
            </div>
          </div>
        `;

        galleryRow.insertAdjacentHTML('beforeend', cardHtml);
      }

      const galleryItems = [
        { file: 'res/gallery_total_250814.jpg', title: '1st configuration', caption: '' },
        { file: 'res/gallery_total_250822.jpg', title: '1st configuration', caption: 'A week after' },
        { file: 'res/gallery_total_250830.jpg', title: '2nd configuration', caption: '' },
        { file: 'res/gallery_total_250916.jpg', title: '3rd configuration', caption: '' },
        { file: 'res/gallery_2nd_250920.jpg', title: '3rd config. 2nd floor', caption: '' },
        { file: 'res/gallery_3rd_250919.jpg', title: 'Testing ESP32', caption: 'Power lanes are being separated' },
        { file: 'res/gallery_broc_250927.jpg', title: 'Broccoli', caption: 'Cute' },
        { file: 'res/gallery_total_250927.jpg', title: 'September 27', caption: '' },
        { file: 'res/gallery_251010.jpg', title: 'October 10', caption: '' },
        { file: 'res/gallery_251016.jpg', title: 'October 16', caption: '' },
        { file: 'res/gallery_251022.jpg', title: 'October 22', caption: '' },
        { file: 'res/gallery_251104.jpg', title: 'September 04', caption: '' },
        { file: 'res/2602260.jpg', title: 'Feb 26, 2026', caption: '' },
        { file: 'res/2602261.jpg', title: 'Feb 26, 2026', caption: '' },
      ];

      fetch('sidebar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('sidebar-placeholder').innerHTML = html;
        });

      galleryItems.forEach(x => {
        insertGalleryCard(x.file, x.title, x.caption);
      });

      document.getElementById('imageModal').addEventListener('show.bs.modal', event => {
        const button = event.relatedTarget;
        const imageSource = button.getAttribute('data-full-size');
        const modalImage = document.getElementById('modalImage');
        modalImage.src = imageSource;
      });
    </script>

  </body>
</html>
