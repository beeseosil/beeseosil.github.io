<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
   /* Custom CSS to enforce the 16:9 aspect ratio on the images */
   .fixed-ratio-card .card-img-top {
    aspect-ratio: 16 / 9;
    object-fit: cover; /* This makes sure the image fills the space */
   }
  </style>
 </head>
 <body>

  <div class="container-fluid">
   
   <div class="row">
    <div class="col-md-3 col-lg-2" id="sidebar-placeholder"></div>

    <main class="col-md-9 col-lg-10 main-content"> <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
      <h1 class="h2">Gallery</h1>
      <div class="btn-toolbar mb-2 mb-md-0">
       <small class="text-muted"></small>
      </div>
     </div>

     <div class="p-4"> <div class="row">
       <div class="col-md-6 mb-4">
        <div class="card fixed-ratio-card">
         <img src="gallery/total_250814.jpg" data-full-size="gallery/total_250814.jpg" class="card-img-top modal-trigger" data-bs-toggle="modal" data-bs-target="#imageModal" alt="Image 1 Description">
         <div class="card-body">
          <h5 class="card-title">1st total configuration</h5>
          <p class="card-text">Total configuration. There's a air pump in the bottom.</p>
         </div>
        </div>
       </div>
       <div class="col-md-6 mb-4">
        <div class="card fixed-ratio-card">
         <img src="gallery/2nd_250917.jpg" data-full-size="gallery/2nd_250917.jpg" class="card-img-top modal-trigger" data-bs-toggle="modal" data-bs-target="#imageModal" alt="Image 2 Description">
         <div class="card-body">
          <h5 class="card-title">2nd total configuration</h5>
          <p class="card-text">Used a large shelf.</p>
         </div>
        </div>
       </div>
       <div class="col-md-6 mb-4">
        <div class="card fixed-ratio-card">
         <img src="gallery/3rd_250919.jpg" data-full-size="gallery/3rd_250919.jpg" class="card-img-top modal-trigger" data-bs-toggle="modal" data-bs-target="#imageModal" alt="Image 3 Description">
         <div class="card-body">
          <h5 class="card-title">3rd configuration</h5>
          <p class="card-text">Organized</p>
         </div>
        </div>
       </div>

       <div class="col-md-6 mb-4">
        <div class="card fixed-ratio-card">
         <img src="gallery/3rd_250919.jpg" data-full-size="gallery/3rd_250919.jpg" class="card-img-top modal-trigger" data-bs-toggle="modal" data-bs-target="#imageModal" alt="Image 4 Description">
         <div class="card-body">
          <h5 class="card-title">Testing ESP32</h5>
          <p class="card-text">Separating powering lanes</p>
         </div>
        </div>
       </div>

      </div>
     </div>
    </main>
   </div>
  </div>
 
  <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
   <div class="modal-dialog modal-xl">
    <div class="modal-content">
     <div class="modal-body">
      <img src="" class="img-fluid" id="modalImage" alt="">
     </div>
    </div>
   </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script>
   fetch('sidebar.html')
    .then(response => response.text())
    .then(html => {
     document.getElementById('sidebar-placeholder').innerHTML = html;
    });
  </script>
 </body>
</html>
